name: Apply Premium POS Redesign

on:
  push:
    branches:
      - feat/premium-pos-redesign

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feat/premium-pos-redesign
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply source patch
        shell: bash
        run: python scripts/patch-premium-pos.py

      - name: Install dependencies
        shell: bash
        run: bun install

      - name: Build Dashboard
        shell: bash
        run: bun run build

      - name: Validate source diff
        shell: bash
        run: |
          rm -f bun.lock
          git diff --check
          git diff --stat

      - name: Commit source changes
        shell: bash
        run: |
          if git diff --quiet -- \
            src/pages/PuntoVenta.tsx \
            src/lib/pos.ts \
            src/index.css \
            src/components/layout/Navigation.tsx \
            src/components/ui/card.tsx \
            src/components/ui/input.tsx \
            src/components/ui/button.tsx; then
            echo "No source changes to commit"
            exit 0
          fi

          git config user.name "racknova096-dot"
          git config user.email "racknova096@gmail.com"
          git add \
            src/pages/PuntoVenta.tsx \
            src/lib/pos.ts \
            src/index.css \
            src/components/layout/Navigation.tsx \
            src/components/ui/card.tsx \
            src/components/ui/input.tsx \
            src/components/ui/button.tsx
          git diff --cached --check
          git commit -m "feat: redesign POS with premium visual workspace"
          git push origin HEAD:feat/premium-pos-redesign
