name: Repair Premium POS Workflow V2

on:
  push:
    branches:
      - feat/premium-pos-redesign

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/premium-pos-redesign
          fetch-depth: 0
      - name: Repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/patch-premium-pos.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "    if: github.event.head_commit.message != 'feat: redesign POS with premium visual workspace'\n",
              "    if: \"github.event.head_commit.message != 'feat: redesign POS with premium visual workspace'\"\n",
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name "racknova096-dot"
          git config user.email "racknova096@gmail.com"
          git rm .github/workflows/repair-premium-pos-v2.yml
          git rm -f .github/workflows/fix-premium-workflow.yml
          git add .github/workflows/patch-premium-pos.yml
          git diff --cached --check
          git commit -m "test: repair premium POS workflow yaml"
          git push origin HEAD:feat/premium-pos-redesign
