name: Validate Free Location Guard

on:
  push:
    branches:
      - feat/free-location-entry-flow

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/free-location-entry-flow
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply guard patch
        run: python scripts/fix_free_location_guard.py
      - name: Install dependencies
        run: bun install
      - name: Build dashboard
        run: bun run build
      - name: Validate free-location guard
        run: |
          grep -q 'throw new Error("No se pudo guardar el producto en backend.")' src/context/InventoryContext.tsx
          grep -q 'const locationVerificationActive =' src/components/inventory/InventoryForm.tsx
          grep -q 'normalizedPatch.ubicacion_verificacion_requerida = false' src/components/inventory/InventoryForm.tsx
          ! grep -q 'LocationIdentityPanel' src/pages/PuntoVenta.tsx
          git diff --check
      - name: Commit functional guard
        run: |
          git config user.name "racknova096-dot"
          git config user.email "racknova096@gmail.com"
          git add src/context/InventoryContext.tsx src/components/inventory/InventoryForm.tsx
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "fix: guard free location entry flow"
            git push origin HEAD:feat/free-location-entry-flow
          fi
