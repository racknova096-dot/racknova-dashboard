name: Validate POS Location Control Cleanup

on:
  push:
    branches:
      - feat/free-location-entry-flow

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/free-location-entry-flow
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Remove stale POS location control
        run: python scripts/fix_pos_location_control.py
      - name: Install dependencies for validation
        run: bun install
      - name: Build dashboard
        run: bun run build
      - name: Validate POS boundary
        run: |
          ! grep -q 'key: "ubicacion_verificacion_requerida"' src/components/scanner/ScanControlPanel.tsx
          ! grep -q 'MapPinCheck' src/components/scanner/ScanControlPanel.tsx
          grep -q 'Control de acomodo en este dispositivo' src/components/inventory/InventoryForm.tsx
          git diff --check
      - name: Commit functional change
        run: |
          git config user.name "racknova096-dot"
          git config user.email "racknova096@gmail.com"
          git add src/components/scanner/ScanControlPanel.tsx
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "fix: keep physical location controls out of POS"
            git push origin HEAD:feat/free-location-entry-flow
          fi
