name: Validate RackNova Scan Engine

on:
  push:
    branches:
      - feat/racknova-scan-engine

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feat/racknova-scan-engine
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply POS Scan Engine integration
        shell: bash
        run: python scripts/patch-scan-engine.py

      - name: Install dependencies
        shell: bash
        run: bun install

      - name: Build Dashboard
        shell: bash
        run: bun run build

      - name: Validate source diff
        shell: bash
        run: |
          rm -f bun.lock
          git diff --check
          git diff --stat

      - name: Commit source integration
        shell: bash
        run: |
          if git diff --quiet -- src/pages/PuntoVenta.tsx src/index.css; then
            echo "Scan Engine source already integrated"
            exit 0
          fi

          git config user.name "racknova096-dot"
          git config user.email "racknova096@gmail.com"
          git add src/pages/PuntoVenta.tsx src/index.css
          git diff --cached --check
          git commit -m "feat: integrate RackNova Scan Engine into POS"
          git push origin HEAD:feat/racknova-scan-engine
