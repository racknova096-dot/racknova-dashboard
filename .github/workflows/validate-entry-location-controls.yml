name: Validate Entry Location Controls

on:
  push:
    branches:
      - feat/free-location-entry-flow

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/free-location-entry-flow
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply entry control patch
        run: python scripts/patch_entry_location_controls.py
      - name: Install dependencies for validation
        run: bun install
      - name: Build dashboard
        run: bun run build
      - name: Validate ownership boundaries
        run: |
          grep -q 'Control de acomodo en este dispositivo' src/components/inventory/InventoryForm.tsx
          grep -q 'guardarConfiguracionScan' src/components/inventory/InventoryForm.tsx
          grep -q 'ubicacion_verificacion_requerida' src/components/inventory/InventoryForm.tsx
          ! grep -q 'Confirmar ubicación con escaneo' src/components/scanner/ScanControlPanel.tsx
          ! grep -q 'MapPinCheck' src/components/scanner/ScanControlPanel.tsx
          git diff --check
      - name: Commit functional changes
        run: |
          git config user.name "racknova096-dot"
          git config user.email "racknova096@gmail.com"
          git add src/components/inventory/InventoryForm.tsx src/components/scanner/ScanControlPanel.tsx
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "feat: manage location verification from inventory entry"
            git push origin HEAD:feat/free-location-entry-flow
          fi
