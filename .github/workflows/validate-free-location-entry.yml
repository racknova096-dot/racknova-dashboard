name: Validate Free Location Entry Dashboard

on:
  push:
    branches:
      - feat/free-location-entry-flow

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/free-location-entry-flow
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply functional patch
        run: |
          python scripts/prepatch_free_location_anchor.py
          python scripts/patch_free_location_entry.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build dashboard
        run: bun run build
      - name: Validate architecture
        run: |
          grep -q 'product.ubicacion_codigo ||' src/context/InventoryContext.tsx
          grep -q 'Ubicación física libre' src/components/inventory/InventoryForm.tsx
          grep -q 'crearUbicacionScan' src/components/inventory/InventoryForm.tsx
          grep -q 'ubicacion_verificacion_requerida' src/components/inventory/InventoryForm.tsx
          grep -q 'Ubicación RNLOC: no requiere comando físico de rack' src/context/InventoryContext.tsx
          grep -q 'Elige dónde guardarás el producto' src/components/inventory/LocationLabelModal.tsx
          ! grep -q 'LocationIdentityPanel' src/pages/PuntoVenta.tsx
          grep -q 'Libre · RNLOC' src/pages/AddProduct.tsx
          git diff --check
      - name: Commit functional changes
        run: |
          git config user.name "racknova096-dot"
          git config user.email "racknova096@gmail.com"
          git add src/context/InventoryContext.tsx src/components/inventory/InventoryForm.tsx src/pages/AddProduct.tsx src/pages/PuntoVenta.tsx src/components/scanner/ScanControlPanel.tsx
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "feat: move free location workflow to inventory entry"
            git push origin HEAD:feat/free-location-entry-flow
          fi
